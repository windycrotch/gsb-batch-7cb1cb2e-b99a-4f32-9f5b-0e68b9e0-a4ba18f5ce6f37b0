name: images

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, models]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [runtime, models]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.target }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          version=edge
          [ "$GITHUB_REF_TYPE" = tag ] && version="$GITHUB_REF_NAME"
          case "$TARGET" in
            runtime) tags=("$IMAGE:$version") ;;
            models) tags=("$IMAGE:$version-models") ;;
          esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$TARGET" = runtime ] && tags+=("$IMAGE:latest") || tags+=("$IMAGE:models")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          for digest in digests/*; do args+=("$IMAGE@sha256:$(basename "$digest")"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
        env:
          TARGET: ${{ matrix.target }}
